<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Consulta de Nota</title>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background-color: #f3f3f3;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {
            width: 90%;
            max-width: 450px;

            background-color: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow:
                0px 4px 15px
                rgba(0, 0, 0, 0.15);
        }


        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            text-align: center;

            color: #222;
        }


        .subtitle {
            margin-bottom: 30px;

            text-align: center;

            color: #666;

            font-size: 15px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }


        input {
            width: 100%;

            padding: 13px;

            font-size: 17px;

            border: 1px solid #ccc;

            border-radius: 5px;

            outline: none;
        }


        input:focus {
            border-color: #555;
        }


        button {
            width: 100%;

            margin-top: 15px;

            padding: 13px;

            font-size: 17px;

            border: none;

            border-radius: 5px;

            background-color: #333;

            color: white;

            cursor: pointer;
        }


        button:hover {
            background-color: #555;
        }


        button:disabled {
            background-color: #999;

            cursor: wait;
        }


        #resultado {
            min-height: 30px;

            margin-top: 25px;

            text-align: center;
        }


        .nota {
            font-size: 28px;

            font-weight: bold;

            color: #222;
        }


        .erro {
            font-size: 15px;

            color: #b00020;
        }


        .rodape {
            margin-top: 30px;

            text-align: center;

            font-size: 12px;

            color: #888;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Consulta de Nota
    </h1>


    <div class="subtitle">

        Digite seu número de matrícula

    </div>


    <label for="registro">

        Número de matrícula

    </label>


    <input
        type="text"
        id="registro"
        maxlength="6"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Ex.: 196847"
        onkeydown="verificarEnter(event)"
    >


    <button
        id="botao"
        onclick="consultarNota()"
    >

        Consultar nota

    </button>


    <div id="resultado"></div>


    <div class="rodape">

        Consulta individual de nota

    </div>


</div>


<script>


    // ========================================================
    // CONFIGURAÇÃO DO SUPABASE
    // ========================================================

    const SUPABASE_URL =
       "https://pkrekhjwzjeiuavtohqz.supabase.co";


    /*
     * COLE ABAIXO A SUA PUBLISHABLE KEY
     *
     * Ela começa com:
     *
     * sb_publishable_
     *
     */

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable__VcEz_agD8ZZxKUsltX4xQ_XaeQRS26";


    // ========================================================
    // CONEXÃO COM O SUPABASE
    // ========================================================

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ========================================================
    // FUNÇÃO DE CONSULTA
    // ========================================================

    async function consultarNota() {


        const campo =
            document.getElementById("registro");


        const resultado =
            document.getElementById("resultado");


        const botao =
            document.getElementById("botao");


        const registro =
            campo.value.trim();


        resultado.innerHTML = "";


        // ----------------------------------------------------
        // VERIFICA CAMPO VAZIO
        // ----------------------------------------------------

        if (registro === "") {

            resultado.innerHTML =
                '<div class="erro">' +
                'Digite seu número de matrícula.' +
                '</div>';

            campo.focus();

            return;
        }


        // ----------------------------------------------------
        // VERIFICA SE POSSUI SOMENTE NÚMEROS
        // ----------------------------------------------------

        if (!/^[0-9]+$/.test(registro)) {

            resultado.innerHTML =
                '<div class="erro">' +
                'Digite somente números.' +
                '</div>';

            campo.focus();

            return;
        }


        // ----------------------------------------------------
        // DESABILITA O BOTÃO
        // ----------------------------------------------------

        botao.disabled = true;

        botao.innerText = "Consultando...";


        // ----------------------------------------------------
        // CONSULTA O SUPABASE
        // ----------------------------------------------------

        const { data, error } =
            await supabaseClient.rpc(
                "consultar_nota",
                {
                    p_registro: registro
                }
            );


        // ----------------------------------------------------
        // REATIVA O BOTÃO
        // ----------------------------------------------------

        botao.disabled = false;

        botao.innerText = "Consultar nota";


        // ----------------------------------------------------
        // VERIFICA ERRO
        // ----------------------------------------------------

        if (error) {
    console.error(error);

    resultado.innerHTML =
        '<div class="erro">' +
        '<strong>Erro técnico:</strong><br><br>' +
        'Código: ' + (error.code || 'não informado') +
        '<br><br>' +
        'Mensagem: ' + (error.message || 'não informada') +
        '<br><br>' +
        'Detalhes: ' + (error.details || 'não informado') +
        '<br><br>' +
        'Sugestão: ' + (error.hint || 'não informada') +
        '</div>';

    return;
}


        // ----------------------------------------------------
        // MATRÍCULA NÃO ENCONTRADA
        // ----------------------------------------------------

        if (!data || data.length === 0) {

            resultado.innerHTML =
                '<div class="erro">' +
                'Número de matrícula não encontrado.' +
                '</div>';

            return;
        }


        // ----------------------------------------------------
        // OBTÉM A NOTA
        // ----------------------------------------------------

        const nota =
            Number(data[0].nota);


        // ----------------------------------------------------
        // FORMATA A NOTA
        // ----------------------------------------------------

        const notaFormatada =
            nota
                .toFixed(2)
                .replace(".", ",");


        // ----------------------------------------------------
        // MOSTRA A NOTA
        // ----------------------------------------------------

        resultado.innerHTML =
            '<div class="nota">' +
            'Nota: ' +
            notaFormatada +
            '</div>';

    }


    // ========================================================
    // ENTER TAMBÉM FAZ A CONSULTA
    // ========================================================

    function verificarEnter(event) {

        if (event.key === "Enter") {

            consultarNota();

        }

    }


</script>


</body>

</html>
